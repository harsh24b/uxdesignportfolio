<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Marquee Refined Test</title>
  <link rel="stylesheet" href="style.css?v=69">
  <style>
    body {
      background-color: #FFFCDE;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    .logo-marquee-container {
      width: 100%;
      overflow: hidden;
      position: relative;
      padding: clamp(24px, 2.8vh, 42px) 0;
      background-color: #FFFCDE;
      mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
      display: flex;
      align-items: center;
      box-sizing: border-box;
      user-select: none;
    }

    .logo-marquee-track {
      display: flex;
      width: max-content;
      animation: marqueeScroll 32s linear infinite;
      will-change: transform;
    }

    .logo-marquee-track:hover {
      animation-play-state: paused;
    }

    @keyframes marqueeScroll {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    .logo-marquee-group {
      display: flex;
      align-items: flex-end;
      flex-shrink: 0;
    }

    /* Individual item: bottom-aligned typography + bigger optically balanced logo */
    .marquee-item {
      display: inline-flex;
      align-items: flex-end;
      gap: clamp(12px, 1.1vw, 18px);
      margin-right: clamp(80px, 7.5vw, 135px);
      flex-shrink: 0;
    }

    .marquee-label {
      font-family: 'MozaicGEO', 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(10.5px, 0.78vw, 12.5px);
      font-weight: 500;
      color: #666666;
      letter-spacing: -0.01em;
      white-space: nowrap;
      line-height: 1.1;
      padding-bottom: 4px; /* Sits cleanly at the bottom */
    }

    .marquee-logo {
      height: clamp(28px, 2.2vw, 36px);
      width: auto;
      object-fit: contain;
      display: block;
      opacity: 0.92;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .marquee-logo.logo-skoda {
      height: clamp(28px, 2.1vw, 34px);
    }

    .marquee-logo.logo-samsung {
      height: clamp(28px, 2.1vw, 34px);
    }

    .marquee-logo.logo-sigchi {
      height: clamp(30px, 2.3vw, 37px);
    }

    .marquee-logo.logo-indiahci {
      height: clamp(28px, 2.1vw, 34px);
    }

    .marquee-item:hover .marquee-logo {
      opacity: 1;
      transform: scale(1.04);
    }

    .marquee-item:hover .marquee-label {
      color: #1a140e;
    }
  </style>
</head>
<body>

  <!-- Mock Hero Frame -->
  <div style="width: 100vw; aspect-ratio: 3840 / 1624; background: url('blueBG.png') center/cover; position: relative; display: flex; align-items: center; justify-content: center;">
    <img src="Silverframe-bg.png" style="position: absolute; bottom: 0; width: 100%; height: 100%; object-fit: cover;">
  </div>

  <!-- Marquee Section -->
  <div class="logo-marquee-container">
    <div class="logo-marquee-track">
      <!-- Set 1 -->
      <div class="logo-marquee-group">
        <div class="marquee-item">
          <span class="marquee-label">Ex-UX Research Intern</span>
          <img src="skodagrey.png" alt="Škoda | Volkswagen" class="marquee-logo logo-skoda">
        </div>
        <div class="marquee-item">
          <span class="marquee-label">2x First Place Winnner</span>
          <img src="samsunggrey.png" alt="Samsung | PRISM" class="marquee-logo logo-samsung">
        </div>
        <div class="marquee-item">
          <span class="marquee-label">Vice Chair</span>
          <img src="sigchigrey.png" alt="MITID SIGCHI ACM" class="marquee-logo logo-sigchi">
        </div>
        <div class="marquee-item">
          <span class="marquee-label">Worked with</span>
          <img src="indiahcigrey.png" alt="IndiaHCI" class="marquee-logo logo-indiahci">
        </div>
      </div>

      <!-- Set 2 (Duplicate for Seamless Infinite Loop) -->
      <div class="logo-marquee-group" aria-hidden="true">
        <div class="marquee-item">
          <span class="marquee-label">Ex-UX Research Intern</span>
          <img src="skodagrey.png" alt="Škoda | Volkswagen" class="marquee-logo logo-skoda">
        </div>
        <div class="marquee-item">
          <span class="marquee-label">2x First Place Winnner</span>
          <img src="samsunggrey.png" alt="Samsung | PRISM" class="marquee-logo logo-samsung">
        </div>
        <div class="marquee-item">
          <span class="marquee-label">Vice Chair</span>
          <img src="sigchigrey.png" alt="MITID SIGCHI ACM" class="marquee-logo logo-sigchi">
        </div>
        <div class="marquee-item">
          <span class="marquee-label">Worked with</span>
          <img src="indiahcigrey.png" alt="IndiaHCI" class="marquee-logo logo-indiahci">
        </div>
      </div>
    </div>
  </div>

</body>
</html>
