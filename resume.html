  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Navbar scroll direction hide/reveal
      const navbarContainer = document.querySelector('.case-study-navbar-container');
      let lastScrollY = window.pageYOffset || document.documentElement.scrollTop;

      window.addEventListener('scroll', () => {
        const scrollY = window.pageYOffset || document.documentElement.scrollTop;
        if (navbarContainer) {
          if (scrollY > lastScrollY && scrollY > 150) {
            navbarContainer.classList.add('nav-hidden');
          } else if (scrollY < lastScrollY) {
            navbarContainer.classList.remove('nav-hidden');
          }
        }
        lastScrollY = Math.max(0, scrollY);
      }, { passive: true });

      // 2. Interactive Draggable Stickers in Footer
      const initContactStickers = () => {
        const footerCard = document.querySelector('.footer-card');
        const stickers = document.querySelectorAll('.footer-sticker');
        if (!footerCard || !stickers.length) return;

        let hasMovedAny = false;
        let isDraggingAny = false;

        const stickerData = Array.from(stickers).map((el) => {
          const style = window.getComputedStyle(el);
          const computedLeft = parseFloat(style.left) || 0;
          const computedTop = parseFloat(style.top) || 0;
          let defaultRot = 0;
          const matchRot = (style.transform || '').match(/rotate\(([-\d.]+)deg\)/);
          if (matchRot) defaultRot = parseFloat(matchRot[1]);

          return {
            el,
            defaultLeft: computedLeft,
            defaultTop: computedTop,
            defaultRot: defaultRot,
            currentLeft: computedLeft,
            currentTop: computedTop,
            currentRot: defaultRot,
            animId: null
          };
        });

        const setStickerPosition = (item, left, top, animate = false) => {
          item.currentLeft = left;
          item.currentTop = top;
          if (animate) {
            item.el.style.transition = 'left 0.65s cubic-bezier(0.16, 1, 0.3, 1), top 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1)';
          } else {
            item.el.style.transition = 'none';
          }
          item.el.style.left = `${left}px`;
          item.el.style.top = `${top}px`;
          item.el.style.transform = `translate(-50%, -50%) rotate(${item.currentRot}deg)`;
        };

        const resetStickersToDefault = (animate = true) => {
          stickerData.forEach(item => {
            if (item.animId) cancelAnimationFrame(item.animId);
            item.currentRot = item.defaultRot;
            setStickerPosition(item, item.defaultLeft, item.defaultTop, animate);
          });
          hasMovedAny = false;
        };

        window.addEventListener('resize', () => {
          resetStickersToDefault(false);
        });

        stickerData.forEach(item => {
          const el = item.el;
          let isDragging = false;
          let startPointerX = 0;
          let startPointerY = 0;
          let startStickerX = 0;
          let startStickerY = 0;
          let lastPointerX = 0;
          let lastPointerY = 0;
          let lastTime = 0;
          let velocityX = 0;
          let velocityY = 0;

          const onPointerDown = (e) => {
            e.preventDefault();
            if (item.animId) cancelAnimationFrame(item.animId);
            isDragging = true;
            isDraggingAny = true;
            hasMovedAny = true;
            el.classList.add('is-dragging');

            const pageX = e.touches ? e.touches[0].pageX : e.pageX;
            const pageY = e.touches ? e.touches[0].pageY : e.pageY;

            startPointerX = pageX;
            startPointerY = pageY;
            lastPointerX = pageX;
            lastPointerY = pageY;
            lastTime = performance.now();
            velocityX = 0;
            velocityY = 0;

            startStickerX = item.currentLeft;
            startStickerY = item.currentTop;
          };

          const onPointerMove = (e) => {
            if (!isDragging) return;
            const pageX = e.touches ? e.touches[0].pageX : e.pageX;
            const pageY = e.touches ? e.touches[0].pageY : e.pageY;
            const now = performance.now();
            const dt = Math.max(1, now - lastTime);

            velocityX = (pageX - lastPointerX) / dt * 16;
            velocityY = (pageY - lastPointerY) / dt * 16;

            lastPointerX = pageX;
            lastPointerY = pageY;
            lastTime = now;

            const dx = pageX - startPointerX;
            const dy = pageY - startPointerY;
            let newLeft = startStickerX + dx;
            let newTop = startStickerY + dy;

            const cardRect = footerCard.getBoundingClientRect();
            const halfW = el.offsetWidth / 2;
            const halfH = el.offsetHeight / 2;
            const pad = 12;

            const minX = halfW + pad;
            const maxX = cardRect.width - halfW - pad;
            const minY = halfH + pad;
            const maxY = cardRect.height - halfH - pad;

            newLeft = Math.max(minX, Math.min(newLeft, maxX));
            newTop = Math.max(minY, Math.min(newTop, maxY));

            setStickerPosition(item, newLeft, newTop, false);
          };

          const onPointerUp = () => {
            if (!isDragging) return;
            isDragging = false;
            isDraggingAny = false;
            el.classList.remove('is-dragging');

            let curLeft = item.currentLeft;
            let curTop = item.currentTop;
            let vx = Math.max(-28, Math.min(velocityX * 1.35, 28));
            let vy = Math.max(-28, Math.min(velocityY * 1.35, 28));
            const friction = 0.91;
            const cardRect = footerCard.getBoundingClientRect();
            const halfW = el.offsetWidth / 2;
            const halfH = el.offsetHeight / 2;
            const pad = 12;
            const minX = halfW + pad;
            const maxX = cardRect.width - halfW - pad;
            const minY = halfH + pad;
            const maxY = cardRect.height - halfH - pad;

            let rot = item.defaultRot + Math.max(-12, Math.min(vx * 0.7, 12));
            item.currentRot = rot;

            const glideStep = () => {
              if (Math.abs(vx) < 0.2 && Math.abs(vy) < 0.2) {
                item.animId = null;
                el.style.transition = 'transform 0.45s cubic-bezier(0.16, 1, 0.3, 1)';
                item.currentRot = item.defaultRot;
                el.style.transform = `translate(-50%, -50%) rotate(${item.defaultRot}deg)`;
                return;
              }

              curLeft += vx;
              curTop += vy;

              if (curLeft <= minX) {
                curLeft = minX;
                vx = -vx * 0.45;
              } else if (curLeft >= maxX) {
                curLeft = maxX;
                vx = -vx * 0.45;
              }

              if (curTop <= minY) {
                curTop = minY;
                vy = -vy * 0.45;
              } else if (curTop >= maxY) {
                curTop = maxY;
                vy = -vy * 0.45;
              }

              vx *= friction;
              vy *= friction;

              setStickerPosition(item, curLeft, curTop, false);
              item.animId = requestAnimationFrame(glideStep);
            };

            item.animId = requestAnimationFrame(glideStep);
          };

          el.addEventListener('mousedown', onPointerDown);
          window.addEventListener('mousemove', onPointerMove);
          window.addEventListener('mouseup', onPointerUp);

          el.addEventListener('touchstart', onPointerDown, { passive: false });
          window.addEventListener('touchmove', onPointerMove, { passive: false });
          window.addEventListener('touchend', onPointerUp);
        });

        let lastScrollYFooter = window.pageYOffset || document.documentElement.scrollTop;
        window.addEventListener('scroll', () => {
          const currentScrollY = window.pageYOffset || document.documentElement.scrollTop;
          const scrollingUp = currentScrollY < lastScrollYFooter;
          lastScrollYFooter = currentScrollY;

          if (scrollingUp && hasMovedAny && !isDraggingAny) {
            const footerRect = footerCard.getBoundingClientRect();
            if (footerRect.top > window.innerHeight * 0.4) {
              resetStickersToDefault(true);
            }
          }
        }, { passive: true });
      };

      initContactStickers();

      // 3. Click to Copy Phone & Email
      const initFooterContactCopy = () => {
        document.querySelectorAll('.footer-contact-item-wrap').forEach(wrap => {
          const link = wrap.querySelector('.footer-contact-item');
          const badge = wrap.querySelector('.copied-badge');
          if (!link || !badge) return;

          let timeoutId = null;

          wrap.addEventListener('click', (e) => {
            e.preventDefault();
            const textToCopy = link.getAttribute('data-copy') || link.textContent.trim();

            const copyAction = () => {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(textToCopy);
              } else {
                return new Promise((resolve, reject) => {
                  try {
                    const ta = document.createElement('textarea');
                    ta.value = textToCopy;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.focus();
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    resolve();
                  } catch (err) {
                    reject(err);
                  }
                });
              }
            };

            copyAction().then(() => {
              badge.classList.add('is-visible');
              if (timeoutId) clearTimeout(timeoutId);
              timeoutId = setTimeout(() => {
                badge.classList.remove('is-visible');
              }, 1800);
            }).catch(err => {
              console.error('Failed to copy: ', err);
            });
          });
        });
      };

      initFooterContactCopy();
    });
  </script>
